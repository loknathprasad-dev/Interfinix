<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interfinix – Interview Preparation Platform</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header id="publicHeader">
        <div class="logo" onclick="showHome()">INTERFINIX</div>
        <div class="nav-container">
            <nav>
                <a onclick="showAbout()">About</a>
                <a onclick="showFaq()">FAQ</a>
            </nav>
            <button class="login-btn" onclick="showLoginModal()">Log In</button>
        </div>
    </header>

    <div id="contentWrapper" class="page-wrapper">
        
        <section id="homePage">
            <div class="hero">
                <div class="hero-img">
                    <img src="https://img.freepik.com/free-photo/headhunters-interviewing-female-job-candidate_1163-4674.jpg?w=740" alt="Interview Prep">
                </div>
                <div class="hero-content">
                    <h1>Interview Preparation Platform</h1>
                    <p>Practice technical and HR interviews in a professional way.</p>
                    <button class="cta-btn" onclick="showSignupModal()">Sign Up Free</button>
                </div>
            </div>
        </section>

        <section id="aboutPage" style="display:none;">
            <div class="about-hero">
                <h1>About Interfinix</h1>
                <p>AI-powered interview practice built for students.</p>
            </div>
        </section>

        <section id="faqPage" style="display:none;">
            <h2 class="section-title">Frequently Asked Questions</h2>
            </section>
    </div>

    <div id="dashboardPage" class="dashboard-page" style="display:none;">
        <nav class="dash-header">
            <div class="dash-logo">DASHBOARD</div>
            <button onclick="logout()">Logout</button>
        </nav>
        <div class="dashboard-content">
            <h2 id="welcomeText">Welcome Back!</h2>
            <div id="jobFieldSection">
                </div>
        </div>
    </div>

    <div id="loginModal" class="modal">
        <div class="modal-content">
            <h2>Login</h2>
            <input type="text" id="loginUserId" placeholder="User ID">
            <input type="password" id="loginPassword" placeholder="Password">
            <button onclick="handleLogin()">Login</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
